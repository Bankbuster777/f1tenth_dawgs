# Input topics handled/muxed.
# For each topic:
# - name    : name identifier to select the topic (*sub-namespace, see below)
# - topic   : input topic of geometry_msgs::Twist type
# - timeout : timeout in seconds to start discarding old messages, and use 0.0 speed instead
# - priority: priority in the range [0, 255]; the higher the more priority over other topics

twist_mux:
  ros__parameters:
    topics:
      navigation:
        topic   : nav_vel
        timeout : 0.5
        priority: 10
      joystick:
        topic   : joy_vel
        timeout : 0.5
        priority: 100
      keyboard:
        topic   : key_vel
        timeout : 0.5
        priority: 90
      tablet:
        topic   : tab_vel
        timeout : 0.5
        priority: 100

ackermann_mux:
  ros__parameters:
    # Brake handling parameters
    # These parameters control automatic brake application during deceleration

    # Enable/disable brake functionality
    # Set to false to completely disable brake topic publishing
    enable_brake: true

    # Deceleration threshold (m/s) - brake is applied when speed decreases more than this value
    # Recommended range: 0.3 - 1.0 m/s
    # - Lower values (0.3-0.5): More sensitive braking for smoother control
    # - Higher values (0.7-1.0): Only brake on significant deceleration
    deceleration_threshold: 0.3

    # Brake gain (Amps per m/s) - proportional gain for brake current calculation
    # Formula: brake_current = abs(speed_diff) * brake_gain
    # Recommended range: 500 - 2000 A/(m/s)
    # - Lower gain (500-1000): Gentler braking
    # - Higher gain (1500-2000): Aggressive braking
    brake_gain: 200

    # Maximum brake current (Amps) - safety limit for brake current
    # Must be less than or equal to VESC brake_max setting
    # Default VESC brake_max: 200000.0 A
    max_brake_current: 20000.0
